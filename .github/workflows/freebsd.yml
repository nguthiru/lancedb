name: FreeBSD

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rust/**
      - python/**
      - .github/workflows/freebsd.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y curl protobuf pkgconf openssl ca_root_nss cmake llvm
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0
          run: |
            . "$HOME/.cargo/env"
            export CC=clang
            export CXX=clang++
            export SSL_CERT_FILE=/usr/local/share/certs/ca-root-nss.crt
            cd rust/lancedb
            cargo build --profile ci --features remote --tests --locked
            cargo test --profile ci --features remote --locked

  python:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Build and test Python bindings on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y curl protobuf pkgconf openssl ca_root_nss cmake llvm py311-pip py311-sqlite3 python311
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python3
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python
            ln -sf /usr/local/bin/pip-3.11 /usr/local/bin/pip
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0
          run: |
            . "$HOME/.cargo/env"
            export CC=clang
            export CXX=clang++
            export SSL_CERT_FILE=/usr/local/share/certs/ca-root-nss.crt
            cd python
            pip install maturin
            maturin build --profile ci
            pip install target/wheels/*.whl
            pip install pytest pyarrow numpy pydantic deprecation packaging tqdm lance-namespace
            python -c "import lancedb; print('lancedb imported successfully')"
            pytest -x -m "not slow and not s3_test" python/tests
